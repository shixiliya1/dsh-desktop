name: Feature request
description: Suggest a focused improvement to DSH Desktop
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What current limitation are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change and how it should work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional existing workflows or workarounds.
  - type: dropdown
    id: platform
    attributes:
      label: Platform scope
      options:
        - All platforms
        - Windows
        - macOS
        - Linux
        - Documentation only
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for similar requests.
          required: true
        - label: This request does not contain credentials or personal data.
          required: true
